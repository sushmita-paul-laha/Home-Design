<article class="design-card">
                      <img [src]="design.image" [alt]="design.title" loading="lazy" />
                      <div class="design-card-body">
                                            <span class="eyebrow">{{ design.category }}</span>
                                            <h3>{{ design.title }}</h3>
                                            <p>By {{ design.designerName }}</p>
                                            <a class="text-link" [routerLink]="['/designers', design.designerId]">View
                                                                  designer <span>↗</span></a>
                      </div>
</article>
